<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>BAZA SPISANIYA — Olly</title>
<meta name="apple-mobile-web-app-title" content="BAZA SPISANIYA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="application-name" content="BAZA SPISANIYA">
<meta name="theme-color" content="#1F2A22">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-512.png">
<style>
  :root{
    --bg:#FAFAF6;
    --surface:#FFFFFF;
    --line:#E7E4DC;
    --ink:#1F2A22;
    --ink-soft:#5C6B60;
    --accent:#2F6F4F;
    --accent-soft:#E7F1EA;
    --warn:#B3492F;
    --st-staff:#3E7D52;
    --st-porcha:#B3492F;
    --st-otrab:#3E6FB0;
    --st-market:#8A4FA6;
    --st-brak:#C4791E;
    --radius:14px;
    --radius-lg:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    overscroll-behavior-y: contain;
  }
  #root{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}

  header.topbar{
    padding:18px 16px 12px;
    background:var(--bg);
    position:sticky; top:0; z-index:20;
    border-bottom:1px solid var(--line);
  }
  header.topbar h1{
    margin:0; font-size:29px; font-weight:900; letter-spacing:0.04em; text-transform:uppercase;
    line-height:1.05;
  }
  header.topbar h1 .accent{ color:var(--accent); }
  header.topbar h1 .rule{
    display:block; width:46px; height:4px; border-radius:2px; margin-top:8px;
    background:linear-gradient(90deg, var(--ink) 0%, var(--accent) 100%);
  }
  header.topbar .sub{color:var(--ink-soft); font-size:13px; margin-top:2px;}

  nav.tabs{ display:flex; gap:6px; padding:10px 16px 0; background:var(--bg); position:sticky; top:64px; z-index:19; }
  nav.tabs button{
    flex:1; padding:10px 8px; border:none; border-radius:12px 12px 0 0;
    background:transparent; color:var(--ink-soft); font-size:13.5px; font-weight:700;
    cursor:pointer; border-bottom:2px solid transparent;
  }
  nav.tabs button.active{ color:var(--accent); border-bottom:2px solid var(--accent); }

  main{flex:1; padding:14px 16px 100px;}

  .search-wrap{position:relative; margin-bottom:10px;}
  input.search{
    width:100%; padding:13px 14px 13px 40px; border-radius:var(--radius);
    border:1px solid var(--line); background:var(--surface); font-size:16px; color:var(--ink);
  }
  .search-wrap svg{position:absolute; left:13px; top:50%; transform:translateY(-50%); opacity:0.45;}

  .chips{display:flex; gap:8px; overflow-x:auto; padding-bottom:10px; margin-bottom:6px; -ms-overflow-style:none; scrollbar-width:none;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{
    flex:0 0 auto; padding:8px 13px; border-radius:999px; font-size:13px; font-weight:600;
    background:var(--surface); border:1px solid var(--line); color:var(--ink-soft); cursor:pointer; white-space:nowrap;
  }
  .chip.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .today-card{ background:var(--accent-soft); border-radius:var(--radius-lg); padding:14px 16px; margin-bottom:14px; }
  .today-card .t{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); margin-bottom:6px;}
  .today-row{display:flex; justify-content:space-between; align-items:center; padding:5px 0; font-size:14px; gap:8px;}
  .today-row .name{color:var(--ink); font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .today-row .qty{color:var(--accent); font-weight:800; white-space:nowrap;}
  .today-row .del{flex:0 0 auto; width:22px; height:22px; border-radius:50%; border:none; background:rgba(179,73,47,0.14); color:var(--warn); font-size:14px; font-weight:800; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center;}
  .today-empty{color:var(--ink-soft); font-size:13.5px;}

  .confirm-sheet{max-width:380px; text-align:center;}
  .confirm-sheet h2{font-size:17px;}
  .confirm-sheet .sub2{margin-bottom:18px;}

  .item-list{display:flex; flex-direction:column; gap:8px;}
  .item-row{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius);
    padding:13px 14px; cursor:pointer;
  }
  .item-row:active{ transform:scale(0.99); }
  .item-main{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .item-name{font-size:15.5px; font-weight:700; color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .item-meta{display:flex; gap:6px; align-items:center; flex-wrap:wrap;}
  .badge{font-size:11px; font-weight:700; padding:2px 7px; border-radius:6px;}
  .badge.pf{background:#EFE6F5; color:var(--st-market);}
  .badge.tovar{background:#EAF0EA; color:var(--ink-soft);}
  .badge.cat{background:#F1EFE9; color:var(--ink-soft);}
  .badge.code{background:#EEF2F7; color:#4C5A6B;}
  .stTag{font-size:11px; font-weight:800; padding:2px 8px; border-radius:6px; color:#fff; white-space:nowrap;}
  .stTag.staff{background:var(--st-staff);}
  .stTag.porcha{background:var(--st-porcha);}
  .stTag.otrab{background:var(--st-otrab);}
  .stTag.market{background:var(--st-market);}
  .stTag.brak{background:var(--st-brak);}
  .chev{color:var(--ink-soft); font-size:20px; flex:0 0 auto;}

  .empty-state{text-align:center; padding:40px 20px; color:var(--ink-soft);}
  .empty-state .big{font-size:34px; margin-bottom:8px;}

  .overlay{
    position:fixed; inset:0; background:rgba(20,24,20,0.45); z-index:50;
    display:flex; align-items:flex-end; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity .18s ease;
  }
  .overlay.show{opacity:1; pointer-events:auto;}
  .sheet{
    width:100%; max-width:560px; background:var(--surface); border-radius:22px 22px 0 0;
    padding:20px 18px 26px; transform:translateY(16px); transition:transform .2s ease;
    max-height:88vh; overflow-y:auto;
  }
  .overlay.show .sheet{ transform:translateY(0); }
  .sheet h2{margin:0 0 2px; font-size:18px; font-weight:800;}
  .sheet .sub2{color:var(--ink-soft); font-size:13px; margin-bottom:16px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; font-weight:700; color:var(--ink-soft); margin-bottom:6px; text-transform:uppercase; letter-spacing:.03em;}
  .field input[type=text], .field input[type=number], .field input[type=date], .field select{
    width:100%; padding:13px 14px; border-radius:12px; border:1px solid var(--line); font-size:16px; background:var(--bg); color:var(--ink);
  }
  .qty-input{font-size:26px !important; font-weight:800; text-align:center;}
  .seg{display:flex; gap:8px; flex-wrap:wrap;}
  .seg button{
    flex:1 1 auto; padding:11px 10px; border-radius:10px; border:1.5px solid var(--line); background:var(--bg);
    font-size:13.5px; font-weight:700; color:var(--ink-soft); cursor:pointer; min-width:100px;
  }
  .seg button.sel{ border-color:var(--ink); color:var(--ink); background:#fff; }
  .actions{display:flex; gap:10px; margin-top:6px;}
  .btn{ flex:1; padding:14px; border-radius:12px; border:none; font-size:15px; font-weight:800; cursor:pointer; }
  .btn.primary{background:var(--accent); color:#fff;}
  .btn.ghost{background:var(--bg); color:var(--ink-soft); border:1px solid var(--line);}
  .btn.danger{background:#FBEBE7; color:var(--warn);}
  .btn:disabled{opacity:.5;}

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:#fff; padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:600;
    z-index:60; opacity:0; transition:opacity .2s ease; pointer-events:none;
  }
  .toast.show{opacity:1;}

  .section-head{ display:flex; align-items:center; justify-content:space-between; margin:18px 0 8px; cursor:default; }
  .section-head h3{margin:0; font-size:14px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft);}
  .section-head .count{font-size:12px; color:var(--ink-soft);}

  .sv-item{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center; gap:10px;
  }
  .sv-item .n{font-weight:700; font-size:14.5px;}
  .sv-item .q{font-weight:800; color:var(--accent); font-size:15px; white-space:nowrap;}
  .day-label{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); margin:14px 0 4px;}

  .float-add{
    position:fixed; right:20px; bottom:26px; width:56px; height:56px; border-radius:50%;
    background:var(--ink); color:#fff; border:none; font-size:28px; display:flex; align-items:center; justify-content:center;
    box-shadow:0 8px 20px rgba(0,0,0,0.2); cursor:pointer; z-index:15;
  }

  .loading{display:flex; align-items:center; justify-content:center; padding:60px 0; color:var(--ink-soft); font-size:14px;}

  .range-row{display:flex; gap:8px; align-items:center; margin-bottom:12px;}
  .range-row input{flex:1;}
  .range-row span{color:var(--ink-soft); font-size:13px;}
</style>
</head>
<body>
<div id="root"><div class="loading">Загрузка базы…</div></div>
<div id="toast" class="toast"></div>

<script>
"use strict";

var STATYI = [
  {key:"Стафф", cls:"staff"},
  {key:"Порча", cls:"porcha"},
  {key:"Отработка / дегустация", cls:"otrab"},
  {key:"Маркетинг / фотосессия", cls:"market"},
  {key:"Бракераж", cls:"brak"}
];
function stCls(name){
  for(var i=0;i<STATYI.length;i++){ if(STATYI[i].key===name) return STATYI[i].cls; }
  return "staff";
}

var SEED_ROWS = [
["Картофель","ОВОЩИ","кг","Стафф","товар"],
["Капуста белокочанная","ОВОЩИ","кг","Стафф","товар"],
["Лук репчатый","ОВОЩИ","кг","Стафф","товар"],
["Огурцы","ОВОЩИ","кг","Стафф","товар"],
["Перец Ласточка","ОВОЩИ","кг","Стафф","товар"],
["Перец чили","ОВОЩИ","кг","Стафф","товар"],
["Перец полугорький","ОВОЩИ","кг","Порча","товар"],
["Помидоры","ОВОЩИ","кг","Стафф","товар"],
["Редиска с ботвой","ОВОЩИ","кг","Стафф","товар"],
["Редька","ОВОЩИ","кг","Стафф","товар"],
["Сельдерей стебель","ОВОЩИ","кг","Стафф","товар"],
["Чеснок","ОВОЩИ","кг","Стафф","товар"],
["Морковь","ОВОЩИ","кг","Стафф","товар"],
["Авокадо","ОВОЩИ","кг","Порча","товар"],
["Кабачки","ОВОЩИ","кг","Порча","товар"],
["Зелень кинза","ЗЕЛЕНЬ","кг","Стафф","товар"],
["Петрушка","ЗЕЛЕНЬ","кг","Стафф","товар"],
["Укроп","ЗЕЛЕНЬ","кг","Стафф","товар"],
["Вырезка говядина/конина","МЯСО","кг","Стафф","пф"],
["Колбаски гриль","МЯСО","кг","Стафф","товар"],
["Мясо ГОВЯДИНА СТАФФ","МЯСО","кг","Стафф","товар"],
["Куриное филе","ПТИЦА","кг","Стафф","товар"],
["Окорочка с/м","ПТИЦА","кг","Стафф","товар"],
["Масло сливочное 82% (Президент)","МОЛОЧКА И ЯЙЦО","кг","Стафф","товар"],
["Молоко 3.2% 1 л","МОЛОЧКА И ЯЙЦО","л","Стафф","товар"],
["Яйцо","МОЛОЧКА И ЯЙЦО","шт","Стафф","товар"],
["Сыр страчателла","СЫРЫ","кг","Порча","товар"],
["Кофе растворимый","БАКАЛЕЯ","кг","Стафф","товар"],
["Крупа манная","БАКАЛЕЯ","кг","Стафф","товар"],
["Крупа горох","БАКАЛЕЯ","кг","Стафф","товар"],
["Крупа гречка","БАКАЛЕЯ","кг","Стафф","товар"],
["Кукуруза консервированная","БАКАЛЕЯ","кг","Стафф","товар"],
["Лапша Лия","БАКАЛЕЯ","кг","Стафф","товар"],
["Макароны стафф","БАКАЛЕЯ","кг","Стафф","товар"],
["Масло растительное","БАКАЛЕЯ","кг","Стафф","товар"],
["Мука в/с","БАКАЛЕЯ","кг","Стафф","товар"],
["Паста томатная","БАКАЛЕЯ","кг","Стафф","товар"],
["Рис","БАКАЛЕЯ","кг","Стафф","товар"],
["Сахар","БАКАЛЕЯ","кг","Стафф","товар"],
["Соль","БАКАЛЕЯ","кг","Стафф","товар"],
["Тесто лагман","БАКАЛЕЯ","кг","Стафф","товар"],
["Фритюрное масло","БАКАЛЕЯ","кг","Стафф","товар"],
["Хлопья 5 злаков овсянка","БАКАЛЕЯ","кг","Стафф","товар"],
["Майонез","СОУСЫ И СПЕЦИИ","кг","Стафф","товар"],
["Соус соевый","СОУСЫ И СПЕЦИИ","кг","Стафф","товар"],
["Специи в асс.","СОУСЫ И СПЕЦИИ","кг","Стафф","товар"],
["Зира молотая","СОУСЫ И СПЕЦИИ","кг","Порча","товар"],
["Бриошь тост","ХЛЕБ И ВЫПЕЧКА","кг","Стафф","товар"],
["Хлеб тартин","ХЛЕБ И ВЫПЕЧКА","кг","Стафф","товар"]
];
var SEED_NOMENCLATURE = SEED_ROWS.map(function(r,i){
  return {id:"seed_"+i, name:r[0], category:r[1], unit:r[2], defaultStatya:r[3], type:r[4]};
});
var CATEGORIES = SEED_NOMENCLATURE.map(function(n){return n.category;}).filter(function(v,i,a){return a.indexOf(v)===i;});

// Категории пересчитываются от реальной загруженной базы (см. recomputeCategories),
// а не только от стартового примерного списка — иначе после импорта настоящей
// номенклатуры iiko фильтр по категориям во вкладке «Ввод» не увидел бы новые группы.
function recomputeCategories(){
  var fromData = state.nomenclature.map(function(n){ return n.category; }).filter(Boolean);
  var merged = fromData.length ? fromData : SEED_NOMENCLATURE.map(function(n){ return n.category; });
  CATEGORIES = merged.filter(function(v,i,a){ return a.indexOf(v)===i; });
  if(CATEGORIES.indexOf(addState.category) === -1){ addState.category = CATEGORIES[0]; }
}

function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtDate(iso){
  if(!iso) return '';
  var p = iso.split('-');
  if(p.length!==3) return iso;
  var months = ['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
  var mi = parseInt(p[1],10)-1;
  return parseInt(p[2],10)+' '+(months[mi]||p[1])+' '+p[0];
}
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]; }); }
function capFirst(s){ return s ? s[0]+s.slice(1).toLowerCase() : s; }

var state = {
  loading: true,
  nomenclature: [],
  records: [],
  tab: "vvod",
  vvodQuery: "",
  vvodCat: "Все",
  vvodViewDate: todayStr(),
  activeItemId: null,
  svodStatya: STATYI[0].key,
  svodFrom: new Date(Date.now()-6*86400000).toISOString().slice(0,10),
  svodTo: todayStr(),
  svodShowProcessed: false,
  svodGroupByDay: false,
  tovaryQuery: "",
  showAddForm: false
};

var toastTimer = null;
function showToast(msg){
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, 1800);
}

var EXEC_URL = "https://script.google.com/macros/s/AKfycbw-v9OsZau8FNrkRX6mg1hhw-Q_3n7a_AzEyMMotJyAADPYMu4kGtwp9mDHw6TkyTYvhA/exec";
function scriptUrl_(){
  return EXEC_URL;
}

// Обычные HTTP-запросы вместо google.script.run — надёжнее работает в мобильных браузерах
function api(action, payload){
  if(action === 'getData'){
    return fetch(scriptUrl_() + '?action=getData', {method:'GET', cache:'no-store'})
      .then(function(r){ return r.json(); });
  }
  return fetch(scriptUrl_(), {
    method: 'POST',
    headers: {'Content-Type': 'text/plain;charset=utf-8'}, // так не триггерится CORS preflight, который Apps Script не поддерживает
    body: JSON.stringify({action: action, payload: payload})
  }).then(function(r){ return r.json(); });
}

var isSyncing = false;

async function loadData(silent){
  if(isSyncing) return;
  isSyncing = true;
  try{
    var data = await api('getData');
    if(data && data.error) throw new Error(data.error);
    state.nomenclature = data.nomenclature || [];
    state.records = (data.records || []).map(function(r){ return Object.assign({}, r, {qty: parseFloat(r.qty)}); });
    recomputeCategories();
  }catch(e){
    console.error("load failed", e);
    if(!silent) showToast("Не удалось загрузить данные — проверь связь");
  }
  isSyncing = false;
  state.loading = false;
  // не перерисовываем поверх открытой модалки/поля ввода, чтобы не сбить то, что человек печатает
  if(!state.activeItemId && !state.showAddForm){ render(); }
}

// автообновление раз в 8 секунд — приближение к «реальному времени»
setInterval(function(){ loadData(true); }, 8000);

function findNom(id){
  for(var i=0;i<state.nomenclature.length;i++){ if(state.nomenclature[i].id===id) return state.nomenclature[i]; }
  return null;
}

/* ---------- RENDER ---------- */

function render(){
  var root = document.getElementById("root");
  if(state.loading){
    root.innerHTML = '<div class="loading">Загрузка базы…</div>';
    return;
  }
  var html = '';
  html += '<header class="topbar"><h1>BAZA <span class="accent">SPISANIYA</span><span class="rule"></span></h1><div class="sub">Olly Pub &amp; Breakfast</div></header>';
  html += '<nav class="tabs">';
  html += '<button data-tab="vvod" class="'+(state.tab==="vvod"?"active":"")+'">Ввод</button>';
  html += '<button data-tab="svod" class="'+(state.tab==="svod"?"active":"")+'">Для бухгалтера</button>';
  html += '<button data-tab="tovary" class="'+(state.tab==="tovary"?"active":"")+'">Товары</button>';
  html += '</nav>';
  html += '<main id="main"></main>';
  root.innerHTML = html;

  var main = document.getElementById("main");
  if(state.tab==="vvod") main.innerHTML = renderVvod();
  else if(state.tab==="svod") main.innerHTML = renderSvod();
  else main.innerHTML = renderTovary();

  bindTabButtons();
  if(state.tab==="vvod") bindVvod();
  else if(state.tab==="svod") bindSvod();
  else bindTovary();

  if(state.activeItemId){ renderEntrySheet(); }
  if(state.showAddForm){ renderAddSheet(); }
  if(confirmState){ renderConfirmSheet(); }
}

function bindTabButtons(){
  var btns = document.querySelectorAll('nav.tabs button');
  btns.forEach(function(b){
    b.addEventListener('click', function(){
      state.tab = b.getAttribute('data-tab');
      state.activeItemId = null;
      state.showAddForm = false;
      render();
    });
  });
}

/* ---------- VVOD TAB ---------- */

function searchIconSvg(){
  return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="11" cy="11" r="7" stroke="#1F2A22" stroke-width="2"/><path d="M20 20L16.5 16.5" stroke="#1F2A22" stroke-width="2" stroke-linecap="round"/></svg>';
}

function filteredNomenclature(){
  var list = state.nomenclature;
  if(state.vvodCat!=="Все") list = list.filter(function(n){ return n.category===state.vvodCat; });
  var q = state.vvodQuery.trim().toLowerCase();
  if(q) list = list.filter(function(n){ return n.name.toLowerCase().indexOf(q)>=0; });
  return list;
}

function renderVvod(){
  var isToday = state.vvodViewDate === todayStr();
  var viewRecords = state.records.filter(function(r){ return r.date===state.vvodViewDate; }).sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); });

  var html = '';

/* ---------- SVOD TAB (for accountant) ---------- */

function inRange(d){ return d>=state.svodFrom && d<=state.svodTo; }

function aggregate(list){
  var map = {};
  list.forEach(function(r){ map[r.nomenclatureId] = (map[r.nomenclatureId]||0) + r.qty; });
  var out = Object.keys(map).map(function(id){
    var n = findNom(id);
    return {id:id, name:n?n.name:"—", unit:n?n.unit:"", qty:map[id]};
  });
  out.sort(function(a,b){ return a.name.localeCompare(b.name,"ru"); });
  return out;
}

function aggregateByDay(list){
  var byDate = {};
  list.forEach(function(r){
    if(!byDate[r.date]) byDate[r.date] = [];
    byDate[r.date].push(r);
  });
  var dates = Object.keys(byDate).sort().reverse();
  return dates.map(function(d){ return {date:d, items:aggregate(byDate[d])}; });
}

function renderSvodItemsFlat(list, dim){
  var agg = aggregate(list);
  var html = '';
  agg.forEach(function(it){
    html += '<div class="sv-item"'+(dim?' style="opacity:.55"':'')+'><div class="n">'+esc(it.name)+'</div><div class="q">'+numFmt(it.qty)+' '+esc(it.unit)+'</div></div>';
  });
  return html;
}

function renderSvodItemsByDay(list, dim){
  var groups = aggregateByDay(list);
  var html = '';
  groups.forEach(function(g){
    html += '<div class="day-label">'+fmtDate(g.date)+'</div>';
    g.items.forEach(function(it){
      html += '<div class="sv-item"'+(dim?' style="opacity:.55"':'')+'><div class="n">'+esc(it.name)+'</div><div class="q">'+numFmt(it.qty)+' '+esc(it.unit)+'</div></div>';
    });
  });
  return html;
}

function renderSvod(){
  var notProcessed = state.records.filter(function(r){ return r.statya===state.svodStatya && r.status==="not_processed" && inRange(r.date); });
  var processed = state.records.filter(function(r){ return r.statya===state.svodStatya && r.status==="processed" && inRange(r.date); });
  var byDay = !!state.svodGroupByDay;

  var html = '';
  html += '<div class="chips">';
  STATYI.forEach(function(s){
    html += '<div class="chip'+(state.svodStatya===s.key?" active":"")+'" data-statya="'+esc(s.key)+'">'+esc(s.key)+'</div>';
  });
  html += '</div>';

  html += '<div class="range-row"><input type="date" id="svodFrom" value="'+state.svodFrom+'"><span>—</span><input type="date" id="svodTo" value="'+state.svodTo+'"></div>';

  html += '<div class="chips" style="margin-top:2px">';
  html += '<div class="chip'+(!byDay?" active":"")+'" id="svodModeTotal">Итого за период</div>';
  html += '<div class="chip'+(byDay?" active":"")+'" id="svodModeByDay">По дням</div>';
  html += '</div>';

  html += '<div class="section-head"><h3>Не проведено в iiko</h3><span class="count">'+notProcessed.length+' зап.</span></div>';
  if(notProcessed.length===0){
    html += '<div class="empty-state" style="padding:24px 10px"><div class="big">✓</div>За этот период по статье «'+esc(state.svodStatya)+'» всё уже проведено</div>';
  }else{
    html += byDay ? renderSvodItemsByDay(notProcessed,false) : renderSvodItemsFlat(notProcessed,false);
    html += '<button class="btn primary" id="markProcessed" style="width:100%;margin-top:8px">Отметить проведённым в iiko</button>';
  }

  var procCount = processed.length;
  html += '<div class="section-head" id="toggleProcessed" style="cursor:pointer"><h3>Уже проведено '+(state.svodShowProcessed?"▲":"▼")+'</h3><span class="count">'+procCount+' зап.</span></div>';
  if(state.svodShowProcessed){
    if(procCount===0){
      html += '<div class="today-empty">Пока нет проведённых записей за период</div>';
    }else{
      html += byDay ? renderSvodItemsByDay(processed,true) : renderSvodItemsFlat(processed,true);
    }
  }
  return html;
}

function bindSvod(){
  document.querySelectorAll('.chip[data-statya]').forEach(function(el){
    el.addEventListener('click', function(){
      state.svodStatya = el.getAttribute('data-statya');
      render();
    });
  });
  var from = document.getElementById('svodFrom');
  var to = document.getElementById('svodTo');
  if(from) from.addEventListener('change', function(){ state.svodFrom = from.value; render(); });
  if(to) to.addEventListener('change', function(){ state.svodTo = to.value; render(); });
  var toggle = document.getElementById('toggleProcessed');
  if(toggle) toggle.addEventListener('click', function(){ state.svodShowProcessed = !state.svodShowProcessed; render(); });
  var modeTotal = document.getElementById('svodModeTotal');
  var modeByDay = document.getElementById('svodModeByDay');
  if(modeTotal) modeTotal.addEventListener('click', function(){ state.svodGroupByDay = false; render(); });
  if(modeByDay) modeByDay.addEventListener('click', function(){ state.svodGroupByDay = true; render(); });
  var markBtn = document.getElementById('markProcessed');
  if(markBtn) markBtn.addEventListener('click', async function(){
    var idList = [];
    state.records.forEach(function(r){
      if(r.statya===state.svodStatya && r.status==="not_processed" && inRange(r.date)) idList.push(r.id);
    });
    if(idList.length===0) return;
    var idSet = {};
    idList.forEach(function(id){ idSet[id]=true; });
    var prevRecords = state.records;
    state.records = state.records.map(function(r){
      return idSet[r.id] ? Object.assign({}, r, {status:"processed"}) : r;
    });
    render();
    try{
      var res = await api('markProcessed', {ids: idList});
      if(res && res.error) throw new Error(res.error);
      showToast("Отмечено проведённым в iiko");
    }catch(e){
      console.error(e);
      state.records = prevRecords;
      render();
      showToast("Не удалось отметить — проверь связь");
    }
  });
}

    if(exists){ showToast("Такой товар уже есть в базе"); return; }
    var item = { id:"n_"+Date.now()+"_"+Math.random().toString(36).slice(2,7), name:name, type:addState.type, category:addState.category, unit:addState.unit, defaultStatya:addState.statya, code:addState.code.trim() };
    state.nomenclature.push(item);
    state.showAddForm = false;
    addState = { name:"", type:"товар", category:CATEGORIES[0], unit:"кг", statya:STATYI[0].key, code:"" };
    var ovNow2 = document.getElementById('addOverlay');
    if(ovNow2) ovNow2.remove();
    render();
    try{
      var res = await api('addNomenclature', item);
      if(res && res.error) throw new Error(res.error);
      showToast('«'+name+'» добавлен в базу');
    }catch(e){
      console.error(e);
      state.nomenclature = state.nomenclature.filter(function(n){ return n.id!==item.id; });
      render();
      showToast("Не сохранилось — проверь связь и повтори");
    }
  });
}

function closeAddSheet(){
  state.showAddForm = false;
  addState = { name:"", type:"товар", category:CATEGORIES[0], unit:"кг", statya:STATYI[0].key };
  var ov = document.getElementById('addOverlay');
  if(ov) ov.remove();
}

loadData();
</script>
</body>
</html>
